<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Settings Editor</title>
<style>
:root{--pri:#2563eb;--dan:#dc2626;--ok:#16a34a;--bg:#f1f5f9;--card:#fff;--bdr:#e2e8f0;--txt:#1e293b;--mut:#64748b;--side:#1e293b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;background:var(--side);flex-shrink:0;display:flex;flex-direction:column}
#stitle{padding:18px 16px 14px;color:#f8fafc;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #334155}
#nav{flex:1;overflow-y:auto;padding:6px 0}
.nb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 16px;background:none;border:none;border-left:3px solid transparent;color:#94a3b8;font-size:13px;cursor:pointer;text-align:left;transition:all .15s}
.nb:hover{background:#334155;color:#e2e8f0}
.nb.on{background:#1e3a5f;color:#fff;border-left-color:var(--pri)}
.nbg{background:#334155;color:#94a3b8;border-radius:99px;padding:1px 7px;font-size:11px;min-width:20px;text-align:center}
.nb.on .nbg{background:var(--pri);color:#fff}
#stools{padding:12px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:6px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;border-bottom:1px solid var(--bdr);padding:11px 24px;display:flex;align-items:center;gap:10px}
#topbar h2{font-size:16px;font-weight:600;flex:1}
#dirty{color:#d97706;font-size:12px;display:none}
#content{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:8px;margin-bottom:16px}
.ch{padding:12px 16px;background:#f8fafc;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid transparent;user-select:none}
.ch.open{border-radius:8px 8px 0 0;border-bottom-color:var(--bdr)}
.ch:hover{background:#f1f5f9}
.cv{font-size:11px;color:var(--mut);transition:transform .2s}
.ch:not(.open) .cv{transform:rotate(-90deg)}
.ct{font-weight:600;font-size:14px;flex:1}
.cb{padding:16px;display:none}
.cb.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.full{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;font-family:inherit;color:var(--txt);background:#fff;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{min-height:68px;resize:vertical;font-family:'Consolas',monospace;font-size:12px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0}
.crow label{text-transform:none;letter-spacing:normal;font-size:13px;color:var(--txt);cursor:pointer;font-weight:400}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--pri);flex-shrink:0}
.btn{padding:7px 13px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:not-allowed}
.pri{background:var(--pri);color:#fff}.pri:hover:not(:disabled){background:#1d4ed8}
.ok{background:var(--ok);color:#fff}.ok:hover:not(:disabled){background:#15803d}
.dan{background:var(--dan);color:#fff}.dan:hover:not(:disabled){background:#b91c1c}
.ghost{background:#e2e8f0;color:var(--txt)}.ghost:hover:not(:disabled){background:#cbd5e1}
.sm{padding:4px 9px;font-size:12px}
.sbtn{width:100%;justify-content:center;background:#334155;color:#cbd5e1;border-radius:6px}
.sbtn:hover:not(:disabled){background:#475569;color:#fff}
.sbtn.save-btn{background:var(--ok);color:#fff;font-size:14px;padding:11px 12px}
.sbtn.save-btn:hover:not(:disabled){background:#15803d}
.sechdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sechdr h3{font-size:14px;font-weight:600}
hr{border:none;border-top:1px solid var(--bdr);margin:14px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase}
.bw{background:#fef3c7;color:#92400e}.bc{background:#fee2e2;color:#991b1b}
.tw{border:1px solid var(--bdr);border-radius:6px;margin-bottom:10px}
.th{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;background:#f8fafc;border-radius:6px;user-select:none}
.th.open{border-radius:6px 6px 0 0;border-bottom:1px solid var(--bdr)}
.th:hover{background:#f1f5f9}
.tb{padding:13px;display:none}
.tb.open{display:block}
.ac{border:1px solid var(--bdr);border-radius:6px;padding:11px;margin-bottom:8px;background:#fafafa}
.ah{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.atag{background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:monospace}
.afields{display:grid;gap:8px}
#toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
#no-server{display:none;background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px}
</style>
</head>
<body>

<div id="sidebar">
  <div id="stitle">&#9881; Monitoring</div>
  <nav id="nav">
    <button class="nb on" onclick="showPanel('global',this)">Global Settings</button>
    <button class="nb" onclick="showPanel('processes',this)">Processes <span class="nbg" id="bg-processes">1</span></button>
    <button class="nb" onclick="showPanel('cpu',this)">CPU Performance</button>
    <button class="nb" onclick="showPanel('memory',this)">Memory Performance</button>
    <button class="nb" onclick="showPanel('disk',this)">Disk <span class="nbg" id="bg-disk">2</span></button>
    <button class="nb" onclick="showPanel('network',this)">Network <span class="nbg" id="bg-network">2</span></button>
    <button class="nb" onclick="showPanel('ebook',this)">Ebook Sales <span class="nbg" id="bg-ebook">&#9679;</span></button>
  </nav>
  <div id="stools">
    <button id="btn-save" class="btn sbtn save-btn" onclick="saveSettings()">&#128190; Save Changes</button>
    <button id="btn-reload" class="btn sbtn" onclick="reloadSettings()">&#8635; Reload from File</button>
    <button class="btn sbtn" onclick="exportCopy()">&#10515; Export Copy</button>
    <button class="btn sbtn" onclick="copyJSON()">&#128203; Copy JSON</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h2 id="ptitle">Global Settings</h2>
    <span id="dirty">&#9679; Unsaved changes</span>
    <button class="btn ok sm" onclick="saveSettings()" id="btn-save-top">&#128190; Save Changes</button>
  </div>
  <div id="content">
    <div id="no-server">
      &#9888; Running without the local server — Save is disabled. Launch <code>start_editor.bat</code> to enable saving.
    </div>
    <div id="panel-global" class="panel on"></div>
    <div id="panel-processes" class="panel"></div>
    <div id="panel-cpu" class="panel"></div>
    <div id="panel-memory" class="panel"></div>
    <div id="panel-disk" class="panel"></div>
    <div id="panel-network" class="panel"></div>
    <div id="panel-ebook" class="panel"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── Embedded defaults (used when no server is running) ───────────────────────
const DEFAULT_DATA = {"_meta":{"version":"1.0.0","last_updated":"2026-05-27","description":"Server monitoring configuration — defines what to watch, thresholds, and automated actions.","update_notes":"Bump version and update last_updated whenever you change this file."},"global":{"check_interval_sec":5,"log_file":"C:\\Monitoring\\logs\\monitor.log","log_max_size_mb":50,"email_recipient":"carlosgild@gmail.com","email_sender":"monitor@yourserver.local","scripts_dir":"C:\\Monitoring\\scripts"},"processes":[{"name":"Obsidian.exe","display_name":"Obsidian","required":true,"check_interval_sec":30,"actions":{"on_not_running":[{"type":"popup","title":"Process Alert — Obsidian","instructions":"Obsidian.exe is not running as of {timestamp}."},{"type":"log_to_file","level":"warning","instructions":"[{timestamp}] WARNING: Obsidian.exe not detected."}]}}],"performance":{"cpu":{"check_interval_sec":5,"thresholds":[{"level":"warning","percent":20,"sustain_sec":5,"description":"CPU at 20 % sustained for 5 s","actions":[{"type":"popup","title":"CPU Warning","message_template":"CPU usage has been above {percent}% for {sustain_sec}s. Current: {current_value}%  |  Time: {timestamp}"},{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING CPU: {current_value}% sustained {sustain_sec}s (threshold: {percent}%)"}]},{"level":"critical","percent":30,"sustain_sec":5,"description":"CPU at 30 % sustained for 5 s","actions":[{"type":"popup","title":"CPU CRITICAL","message_template":"CRITICAL: CPU at {current_value}% for {sustain_sec}s — immediate attention required!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL CPU: {current_value}% sustained {sustain_sec}s (threshold: {percent}%)"},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] CPU Alert on {hostname} — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nMetric: CPU Usage\nCurrent Value: {current_value}%\nThreshold: {percent}%\nSustained for: {sustain_sec}s\n\nPlease investigate immediately."},{"type":"run_script","path":"{global.scripts_dir}\\on_cpu_critical.ps1","args":["--level","critical","--value","{current_value}"]}]}]},"memory":{"check_interval_sec":5,"thresholds":[{"level":"warning","percent":80,"sustain_sec":5,"description":"RAM at 80 % sustained for 5 s","actions":[{"type":"popup","title":"Memory Warning","message_template":"Memory usage has been above {percent}% for {sustain_sec}s. Current: {current_value}%  |  Time: {timestamp}"},{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING MEM: {current_value}% sustained {sustain_sec}s (threshold: {percent}%)"}]},{"level":"critical","percent":85,"sustain_sec":5,"description":"RAM at 85 % sustained for 5 s","actions":[{"type":"popup","title":"Memory CRITICAL","message_template":"CRITICAL: Memory at {current_value}% for {sustain_sec}s — risk of system instability!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL MEM: {current_value}% sustained {sustain_sec}s (threshold: {percent}%)"},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] Memory Alert on {hostname} — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nMetric: Memory Usage\nCurrent Value: {current_value}%\nThreshold: {percent}%\nSustained for: {sustain_sec}s\n\nPlease investigate immediately."},{"type":"run_script","path":"{global.scripts_dir}\\on_memory_critical.ps1","args":["--level","critical","--value","{current_value}"]}]}]}},"disk":[{"drive":"C:\\","display_name":"System Drive (C:)","check_interval_sec":60,"thresholds":[{"level":"warning","percent_used":75,"description":"Disk C: at 75% capacity","actions":[{"type":"popup","title":"Disk Space Warning — C:","message_template":"Drive C: is {current_value}% full ({free_gb} GB remaining)  |  Time: {timestamp}"},{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING DISK C: {current_value}% used, {free_gb} GB free (threshold: {percent_used}%)"}]},{"level":"critical","percent_used":90,"description":"Disk C: at 90% capacity","actions":[{"type":"popup","title":"Disk Space CRITICAL — C:","message_template":"CRITICAL: Drive C: is {current_value}% full — only {free_gb} GB remaining!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL DISK C: {current_value}% used, {free_gb} GB free (threshold: {percent_used}%)"},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] Disk Space Alert on {hostname} (C:) — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nDrive: C:\\\nUsed: {current_value}%\nFree Space: {free_gb} GB\nThreshold: {percent_used}%\n\nImmediate cleanup or expansion required."},{"type":"run_script","path":"{global.scripts_dir}\\on_disk_critical.ps1","args":["--drive","C:","--value","{current_value}"]}]}]},{"drive":"D:\\","display_name":"Data Drive (D:)","check_interval_sec":60,"thresholds":[{"level":"warning","percent_used":80,"description":"Disk D: at 80% capacity","actions":[{"type":"popup","title":"Disk Space Warning — D:","message_template":"Drive D: is {current_value}% full ({free_gb} GB remaining)  |  Time: {timestamp}"},{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING DISK D: {current_value}% used, {free_gb} GB free (threshold: {percent_used}%)"}]},{"level":"critical","percent_used":92,"description":"Disk D: at 92% capacity","actions":[{"type":"popup","title":"Disk Space CRITICAL — D:","message_template":"CRITICAL: Drive D: is {current_value}% full — only {free_gb} GB remaining!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL DISK D: {current_value}% used, {free_gb} GB free (threshold: {percent_used}%)"},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] Disk Space Alert on {hostname} (D:) — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nDrive: D:\\\nUsed: {current_value}%\nFree Space: {free_gb} GB\nThreshold: {percent_used}%\n\nImmediate cleanup or expansion required."},{"type":"run_script","path":"{global.scripts_dir}\\on_disk_critical.ps1","args":["--drive","D:","--value","{current_value}"]}]}]}],"network":[{"name":"Internet Gateway","host":"8.8.8.8","port":53,"protocol":"icmp","timeout_sec":5,"check_interval_sec":30,"thresholds":[{"level":"warning","latency_ms":150,"description":"Round-trip latency above 150 ms","actions":[{"type":"popup","title":"Network Warning — Gateway","message_template":"High latency to {host}: {current_value}ms (threshold: {latency_ms}ms)  |  Time: {timestamp}"},{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING NET: {host} latency {current_value}ms (threshold: {latency_ms}ms)"}]},{"level":"critical","condition":"unreachable","description":"Host is unreachable / no response","actions":[{"type":"popup","title":"Network CRITICAL — Gateway Unreachable","message_template":"CRITICAL: Cannot reach {host} — possible network outage!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL NET: {host} unreachable"},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] Network Outage on {hostname} — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nTarget: {host}:{port}\nStatus: UNREACHABLE\n\nPossible internet outage or gateway failure. Please investigate immediately."},{"type":"run_script","path":"{global.scripts_dir}\\on_network_down.ps1","args":["--host","{host}"]}]}]},{"name":"Local Server Health Check","host":"localhost","port":8080,"protocol":"tcp","timeout_sec":3,"check_interval_sec":15,"thresholds":[{"level":"critical","condition":"unreachable","description":"Local service on port 8080 not responding","actions":[{"type":"popup","title":"Service Down — localhost:8080","message_template":"CRITICAL: Local service on port 8080 is not responding!  |  Time: {timestamp}"},{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL SVC: localhost:8080 unreachable"},{"type":"run_script","path":"{global.scripts_dir}\\on_service_down.ps1","args":["--port","8080"]}]}]}],"others":{"_comment":"Pending to define. Add new monitoring sections here following the same pattern: name, check_interval_sec, thresholds [ { level, condition/value, actions [] } ]","items":[]}};

let S = JSON.parse(JSON.stringify(DEFAULT_DATA));
let serverAvailable = false;

// ─── Helpers ─────────────────────────────────────────────────────────────────
const esc  = s => String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escT = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clone = o => JSON.parse(JSON.stringify(o));

function markDirty(){ document.getElementById('dirty').style.display='inline'; }
function clearDirty(){ document.getElementById('dirty').style.display='none'; }

let toastTimer;
function toast(msg, ms=2800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

function gp(path){ return path.split('.').reduce((o,k)=>o[isNaN(k)?k:+k],S); }
function sp(path,val){
  const p=path.split('.'), last=p.pop();
  const o=p.reduce((o,k)=>o[isNaN(k)?k:+k],S);
  o[isNaN(last)?last:+last]=val;
}

// ─── Input delegation ────────────────────────────────────────────────────────
document.getElementById('content').addEventListener('input', e=>{
  const p=e.target.dataset.p; if(!p) return;
  let v=e.target.type==='number'?+e.target.value:
        e.target.dataset.lines?e.target.value.split('\n').filter(x=>x.trim()):
        e.target.value;
  sp(p,v); markDirty();
});
document.getElementById('content').addEventListener('change', e=>{
  const p=e.target.dataset.p; if(!p) return;
  let v=e.target.type==='checkbox'?e.target.checked:
        e.target.type==='number'?+e.target.value:e.target.value;
  sp(p,v); markDirty();
});

// ─── Toggle card / threshold ─────────────────────────────────────────────────
function tog(hdr){
  hdr.classList.toggle('open');
  hdr.nextElementSibling.classList.toggle('open');
}

// ─── Navigation ──────────────────────────────────────────────────────────────
const TITLES={global:'Global Settings',processes:'Processes',cpu:'CPU Performance',memory:'Memory Performance',disk:'Disk Monitoring',network:'Network Monitoring',ebook:'Ebook Sales'};
function showPanel(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  btn.classList.add('on');
  document.getElementById('ptitle').textContent=TITLES[id];
}

function updateBadges(){
  document.getElementById('bg-processes').textContent=S.processes.length;
  document.getElementById('bg-disk').textContent=S.disk.length;
  document.getElementById('bg-network').textContent=S.network.length;
  const ebEl=document.getElementById('bg-ebook');
  if(ebEl) ebEl.textContent=S.ebook_sales?'1':'0';
}

// ─── Action rendering ────────────────────────────────────────────────────────
const ACTION_DEFAULTS={
  popup:{type:'popup',title:'',message_template:''},
  log_to_file:{type:'log_to_file',level:'warning',message_template:''},
  email_draft:{type:'email_draft',to:'',subject_template:'',body_template:''},
  run_script:{type:'run_script',path:'',args:[]}
};

function actionFields(a,ap,sec){
  // Processes use 'instructions' as the field name; all other sections use 'message_template'.
  const isProc=sec==='processes';
  const msgField=isProc?'instructions':'message_template';
  const msgLabel=isProc?'Instructions':'Message Template';
  switch(a.type){
    case 'popup': return `
      <div class="fg"><label>Title</label><input type="text" value="${esc(a.title)}" data-p="${ap}.title"></div>
      <div class="fg"><label>${msgLabel}</label><textarea data-p="${ap}.${msgField}">${escT(a[msgField])}</textarea></div>`;
    case 'log_to_file': return `
      <div class="fg"><label>Log Level</label>
        <select data-p="${ap}.level">${['info','warning','error','critical'].map(l=>`<option${l===a.level?' selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>${msgLabel}</label><textarea data-p="${ap}.${msgField}">${escT(a[msgField])}</textarea></div>`;
    case 'email_draft': return `
      <div class="fg"><label>To</label><input type="text" value="${esc(a.to)}" data-p="${ap}.to"></div>
      <div class="fg"><label>Subject Template</label><input type="text" value="${esc(a.subject_template)}" data-p="${ap}.subject_template"></div>
      <div class="fg full"><label>Body Template</label><textarea style="min-height:90px" data-p="${ap}.body_template">${escT(a.body_template)}</textarea></div>`;
    case 'run_script': return `
      <div class="fg"><label>Script Path</label><input type="text" value="${esc(a.path)}" data-p="${ap}.path"></div>
      <div class="fg"><label>Args (one per line)</label><textarea data-p="${ap}.args" data-lines="1">${escT((a.args||[]).join('\n'))}</textarea></div>`;
    default: return '';
  }
}

function renderAction(a,arrPath,idx,sec){
  const ap=`${arrPath}.${idx}`;
  const types=['popup','log_to_file','email_draft','run_script'];
  return `<div class="ac">
    <div class="ah">
      <span class="atag">${a.type}</span>
      <select onchange="changeActType('${arrPath}',${idx},'${sec}',this.value)">
        ${types.map(t=>`<option value="${t}"${t===a.type?' selected':''}>${t}</option>`).join('')}
      </select>
      <button class="btn dan sm" onclick="rmAction('${arrPath}',${idx},'${sec}')">&#10005; Remove</button>
    </div>
    <div class="afields grid">${actionFields(a,ap,sec)}</div>
  </div>`;
}

function renderActions(actions,arrPath,sec){
  return (actions||[]).map((a,i)=>renderAction(a,arrPath,i,sec)).join('');
}

function procAction(defaults,sec){
  // For the processes section swap message_template -> instructions on the default object.
  if(sec!=='processes') return defaults;
  const d=clone(defaults);
  if('message_template' in d){ d.instructions=d.message_template; delete d.message_template; }
  return d;
}
function addAction(arrPath,sec){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  gp(arrPath).push(procAction(clone(ACTION_DEFAULTS.log_to_file),sec));
  rerender(sec,openCards); markDirty();
}
function rmAction(arrPath,idx,sec){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  gp(arrPath).splice(idx,1);
  rerender(sec,openCards); markDirty();
}
function changeActType(arrPath,idx,sec,type){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  const cur=gp(`${arrPath}.${idx}`);
  const nw=procAction(clone(ACTION_DEFAULTS[type]),sec);
  // Preserve the existing text content when switching type.
  const prevText=cur.instructions??cur.message_template??'';
  if('instructions' in nw) nw.instructions=prevText;
  else if('message_template' in nw) nw.message_template=cur.message_template??'';
  gp(arrPath)[idx]=nw;
  rerender(sec,openCards); markDirty();
}

// ─── Threshold rendering ─────────────────────────────────────────────────────
function thresholdMetricFields(t,tp,kind){
  if(kind==='perf') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Percent (%)</label><input type="number" value="${esc(t.percent)}" data-p="${tp}.percent"></div>
    <div class="fg"><label>Sustain (sec)</label><input type="number" value="${esc(t.sustain_sec)}" data-p="${tp}.sustain_sec"></div>
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  if(kind==='disk') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Percent Used (%)</label><input type="number" value="${esc(t.percent_used)}" data-p="${tp}.percent_used"></div>
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  if(kind==='net') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Condition</label>
      <select onchange="netThreshKind('${tp}',this.value,'network')">
        <option value="latency"${t.latency_ms!==undefined?' selected':''}>latency_ms</option>
        <option value="unreachable"${t.condition==='unreachable'?' selected':''}>unreachable</option>
      </select>
    </div>
    ${t.latency_ms!==undefined?`<div class="fg"><label>Latency (ms)</label><input type="number" value="${esc(t.latency_ms)}" data-p="${tp}.latency_ms"></div>`:''}
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  return '';
}

function renderThreshold(t,arrPath,idx,sec,kind){
  const tp=`${arrPath}.${idx}`;
  const badgeCls=t.level==='critical'?'bc':'bw';
  const label=kind==='perf'?`${t.level} — ${t.percent}%`:
               kind==='disk'?`${t.level} — ${t.percent_used}% used`:
               `${t.level}${t.latency_ms!==undefined?' — '+t.latency_ms+'ms':' — unreachable'}`;
  return `<div class="tw">
    <div class="th" onclick="tog(this)">
      <span class="cv">&#9660;</span>
      <span class="badge ${badgeCls}">${t.level}</span>
      <span style="font-size:13px;flex:1">${esc(label)}</span>
      <button class="btn dan sm" onclick="event.stopPropagation();rmThresh('${arrPath}',${idx},'${sec}')">&#10005;</button>
    </div>
    <div class="tb">
      <div class="grid">${thresholdMetricFields(t,tp,kind)}</div>
      <hr>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em">Actions</strong>
        <button class="btn ghost sm" onclick="addAction('${tp}.actions','${sec}')">+ Add Action</button>
      </div>
      ${renderActions(t.actions,`${tp}.actions`,sec)}
    </div>
  </div>`;
}

function renderThresholds(thresholds,arrPath,sec,kind){
  return (thresholds||[]).map((t,i)=>renderThreshold(t,arrPath,i,sec,kind)).join('');
}

function addThresh(arrPath,sec,kind){
  const defaults={perf:{level:'warning',percent:50,sustain_sec:5,description:'',actions:[]},
    disk:{level:'warning',percent_used:80,description:'',actions:[]},
    net:{level:'warning',latency_ms:100,description:'',actions:[]}};
  gp(arrPath).push(clone(defaults[kind]));
  rerender(sec); markDirty();
}
function rmThresh(arrPath,idx,sec){
  gp(arrPath).splice(idx,1);
  rerender(sec); markDirty();
}
function netThreshKind(tp,val,sec){
  const t=gp(tp);
  if(val==='unreachable'){ delete t.latency_ms; t.condition='unreachable'; }
  else { delete t.condition; t.latency_ms=100; }
  rerender(sec); markDirty();
}

// Returns the set of process-card indices that are currently expanded.
function getOpenProcessCards(){
  const open=new Set();
  document.querySelectorAll('#panel-processes .card').forEach((card,i)=>{
    if(card.querySelector('.ch.open')) open.add(i);
  });
  return open;
}

// Renders the Processes panel. openSet (optional Set<number>) restores which
// cards are expanded — all others start collapsed.
function renderProcesses(openSet){
  const procs=S.processes;
  document.getElementById('panel-processes').innerHTML=`
  <div class="sechdr">
    <h3>Monitored Processes (${procs.length})</h3>
    <button class="btn pri sm" onclick="addProcess()">+ Add Process</button>
  </div>
  ${procs.map((p,i)=>`
  <div class="card">
    <div class="ch" onclick="tog(this)">
      <span class="cv">&#9660;</span>
      <span class="ct">${esc(p.display_name||p.name||'New Process')}</span>
      <button class="btn dan sm" onclick="event.stopPropagation();rmProcess(${i})">&#10005; Remove</button>
    </div>
    <div class="cb">
      <div class="grid">
        <div class="fg"><label>Process Name (exe)</label><input type="text" value="${esc(p.name)}" data-p="processes.${i}.name"></div>
        <div class="fg"><label>Display Name</label><input type="text" value="${esc(p.display_name)}" data-p="processes.${i}.display_name"></div>
        <div class="fg"><label>Check Interval (sec)</label><input type="number" value="${p.check_interval_sec}" data-p="processes.${i}.check_interval_sec"></div>
        <div class="fg" style="justify-content:flex-end"><div class="crow"><input type="checkbox" id="req${i}"${p.required?' checked':''} data-p="processes.${i}.required"><label for="req${i}">Required (alert if not running)</label></div></div>
      </div>
      <hr>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em">Actions: On Not Running</strong>
        <button class="btn ghost sm" onclick="addAction('processes.${i}.actions.on_not_running','processes')">+ Add Action</button>
      </div>
      ${renderActions(p.actions.on_not_running,`processes.${i}.actions.on_not_running`,'processes')}
    </div>
  </div>`).join('')}`;
  // Restore expanded state without touching cards that should stay collapsed.
  if(openSet&&openSet.size>0){
    const cards=document.querySelectorAll('#panel-processes .card');
    openSet.forEach(i=>{
      if(!cards[i]) return;
      cards[i].querySelector('.ch').classList.add('open');
      cards[i].querySelector('.cb').classList.add('open');
    });
  }
  updateBadges();
}

function addProcess(){
  // New process goes to the top (unshift) and starts expanded (index 0).
  // Existing open cards shift down by 1.
  const prevOpen=getOpenProcessCards();
  const newOpen=new Set([0]);
  prevOpen.forEach(i=>newOpen.add(i+1));
  S.processes.unshift({name:'',display_name:'New Process',required:false,check_interval_sec:30,actions:{on_not_running:[]}});
  renderProcesses(newOpen); markDirty();
}
function rmProcess(i){
  if(confirm('Remove this process?')){
    const prevOpen=getOpenProcessCards();
    const newOpen=new Set();
    prevOpen.forEach(idx=>{ if(idx<i) newOpen.add(idx); else if(idx>i) newOpen.add(idx-1); });
    S.processes.splice(i,1);
    renderProcesses(newOpen); markDirty();
  }
}

function renderPerf(metric){
  const cfg=S.performance[metric];
  const label=metric==='cpu'?'CPU':'Memory';
  document.getElementById('panel-'+metric).innerHTML=`

    <div class="cb open"><div class="grid">
      <div class="fg"><label>Check Interval (sec)</label><input type="number" value="${cfg.check_interval_sec}" data-p="performance.${metric}.check_interval_sec"></div>
    </div></div>
  </div>
  <div class="sechdr">
    <h3>Thresholds (${cfg.thresholds.length})</h3>

  </div>

}

function addDisk(){

function rmDisk(i){ if(confirm('Remove this drive?')){ S.disk.splice(i,1); renderDisk(); markDirty(); } }

function openEbookFile(){
  const path=document.querySelector('[data-p="ebook_sales.xlsx_path"]').value.trim();
  if(!path){alert('No file path set.');return;}
  fetch('/api/open-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})})
    .then(r=>r.json())
    .then(d=>{if(!d.ok)alert('Could not open file:\n'+(d.error||'Unknown error'));})
    .catch(()=>alert('Server unavailable — is the editor server running?'));
}

function rerender(sec,openCards){
  if(sec==='global') renderGlobal();
  else if(sec==='processes') renderProcesses(openCards);
  else if(sec==='cpu') renderPerf('cpu');
  else if(sec==='memory') renderPerf('memory');
  else if(sec==='disk') renderDisk();
  else if(sec==='network') renderNetwork();
  else if(sec==='ebook') renderEbookSales();
  updateBadges();
}

function renderAll(){
  renderGlobal(); renderProcesses();
  renderPerf('cpu'); renderPerf('memory');
  renderDisk(); renderNetwork();
  renderEbookSales();
  updateBadges();
}

// ─── Server API ───────────────────────────────────────────────────────────────
function getJSON(){
  S._meta.last_updated = new Date().toISOString().slice(0,10);
  return JSON.stringify(S, null, 2);
}

function setSaveBusy(busy){
  ['btn-save','btn-save-top'].forEach(id=>{
    const b=document.getElementById(id); if(!b) return;
    b.disabled=busy;
    b.innerHTML=busy?'&#9203; Saving&hellip;':'&#128190; Save Changes';
  });
}

async function saveSettings(){
  if(!serverAvailable){ toast('Server not running — launch start_editor.bat to enable saving.', 4000); return; }
  try{
    setSaveBusy(true);
    const res=await fetch('/api/settings',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:getJSON()
    });
    if(!res.ok) throw new Error(`Server responded ${res.status}`);
    // Re-read from server so UI reflects exactly what was written to disk
    const saved=await fetch('/api/settings');
    S=await saved.json();
    renderAll();
    clearDirty();
    toast('✓ Saved to monitoring_settings.json');
  }catch(err){
    toast('Save failed: '+err.message, 4000);
  }finally{
    setSaveBusy(false);
  }
}

async function reloadSettings(){
  if(!serverAvailable){ toast('Server not running.', 3000); return; }
  if(document.getElementById('dirty').style.display!=='none'){
    if(!confirm('Discard unsaved changes and reload from file?')) return;
  }
  try{
    const res=await fetch('/api/settings');
    S=await res.json();
    renderAll(); clearDirty();
    toast('Reloaded from monitoring_settings.json');
  }catch(err){
    toast('Reload failed: '+err.message, 4000);
  }
}

// ─── Export / Copy (no server needed) ────────────────────────────────────────
function exportCopy(){
  const blob=new Blob([getJSON()],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='monitoring_settings.json'; a.click();
  toast('Copy downloaded');
}

function copyJSON(){
  navigator.clipboard.writeText(getJSON())
    .then(()=>toast('JSON copied to clipboard'))
    .catch(()=>toast('Copy failed',3000));
}

// ─── Ctrl+S ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveSettings(); }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const res=await fetch('/api/settings');
    if(res.ok){
      S=await res.json();
      serverAvailable=true;
    }
  }catch{
    // Running without the server — show banner, disable Save
    document.getElementById('no-server').style.display='block';
    document.getElementById('btn-save').disabled=true;
    document.getElementById('btn-reload').disabled=true;
  }
  renderAll();
}

init();
</script>
